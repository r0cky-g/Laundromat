spring.application.name=notification-service

spring.datasource.url=${NOTIFICATION_DB_URL:jdbc:mysql://localhost:3306/notification_db}
spring.datasource.username=${NOTIFICATION_DB_USERNAME:notification_service}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD:}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
notification.mail.from=${MAIL_FROM:}
