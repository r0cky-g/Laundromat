<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared UI — Absolute Laundry</title>

  <!-- Keep the CSS files in this order -->
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/laundry-hero.css">
  <link rel="stylesheet" href="../assets/css/template.css">
</head>

<body class="page-wrapper">

  <!-- Add the navbar here -->
  <div id="navbar-placeholder"></div>

  <main class="page-main">
    <div class="container">

      <header class="laundry-hero">
        <div>
          <p>Explore the buttons, forms and reservation states used across Absolute Laundry.</p>
          <a class="btn btn--primary" href="#component-preview">Explore the shared UI</a>
        </div>
        <div class="laundry-illustration" aria-hidden="true">
          <div class="laundry-illustration__washer"></div>
        </div>
      </header>

      <section id="component-preview" class="preview-components" aria-labelledby="preview-title">
        <h2 id="preview-title">Shared UI</h2>
        <div class="grid grid--2">
          <!-- Demo form -->
          <form class="card" id="example-form">
            <div class="card__header">
              <h3 class="card__title">Form controls</h3>
            </div>
            <div class="card__body">

              <div class="form-group">
                <label class="form-label required" for="example-input">Reservation name</label>
                <input id="example-input" type="text" class="form-input" placeholder="Enter a name" required
                  aria-describedby="example-hint">
                <span class="form-hint" id="example-hint">Use a name you can recognize later.</span>
              </div>

              <div class="form-group">
                <label class="form-label" for="example-select">Status</label>
                <select id="example-select" class="form-select">
                  <option value="">Select...</option>
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                </select>
              </div>

            </div>
            <div class="card__footer">
              <button type="reset" class="btn btn--secondary">Reset</button>
              <button type="submit" class="btn btn--primary">Show toast</button>
            </div>
          </form>
          <div class="card">
            <div class="card__header">
              <h3 class="card__title">Reservation states</h3>
            </div>
            <div class="card__body">
              <div class="preview-statuses">
                <span class="badge badge--success">Confirmed</span>
                <span class="badge badge--warning">Pending</span>
                <span class="badge badge--error">Cancelled</span>
                <span class="badge badge--info">In Progress</span>
                <span class="badge badge--default">Default</span>
              </div>

              <div class="alert alert--info">
                <span>ℹ</span>
                <span>Your reservation is pending confirmation.</span>
              </div>
            </div>
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- Add the footer here -->
  <div id="footer-placeholder"></div>

  <!-- Keep the scripts in this order -->
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/components.js"></script>

  <!-- Run when the demo form is submitted -->
  <script>
    document.getElementById('example-form').addEventListener('submit', (event) => {
      event.preventDefault();
      showToast('The form passed validation.', 'success');
    });
  </script>

</body>

</html>
